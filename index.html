<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name and Occupation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .profile {
      border: 1px solid #ccc;
      padding: 16px;
      max-width: 300px;
    }
    .name {
      font-size: 1.5em;
      font-weight: bold;
    }
    .occupation {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="profile">
    <div class="name">John </div>
    <div class="occupation">Drexel Student</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Questions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      max-width: 700px;
    }
    h2 {
      margin-top: 40px;
    }
    .question-block {
      margin-bottom: 30px;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <h1>Course Questions</h1>

  <div class="question-block">
    <h2>Major</h2>
    <textarea placeholder="My major is currently undecided but heavily considering computer science or game development"></textarea>
  </div>

  <div class="question-block">
    <h2>Why you're taking this course</h2>
    <textarea placeholder="I am primarily taking this course due to my interest in the cs field"></textarea>
  </div>

  <div class="question-block">
    <h2>When AI became a part of your life</h2>
    <textarea placeholder="Ai showed by in my life around 10th grade when I used it to help me with school work"></textarea>
  </div>

  <div class="question-block">
    <h2>Your honest opinion or skepticism about AI</h2>
    <textarea placeholder="While I do find ai useful, big corporations are pushing ai way to much"></textarea>
  </div>

  <div class="question-block">
    <h2>Hobby</h2>
    <textarea placeholder="A few of my hobbies include video games, basketball, america football, and weightlifting"></textarea>
  </div>

</body>
</html>
